<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InBetween Mapping</title>
    <link rel="stylesheet" href="Styles/style.css">
</head>
<body>
    <!-- 1. Noise Background Canvas (z-index: 1, full viewport) -->
    <canvas id="noise-canvas"></canvas>

    <!-- Square Board Frame that fits window and scales everything uniformly -->
    <div id="board-frame">
        <!-- 2. Connections SVG Layer (z-index: 5) -->
        <svg id="connection-svg-layer" viewBox="0 0 1000 1000" width="1000" height="1000"></svg>

        <!-- 2.5 Comment Connections SVG Layer (z-index: 6) -->
        <svg id="comment-connection-svg-layer" viewBox="0 0 1000 1000" width="1000" height="1000"></svg>

        <!-- 3. Universe Bubbles Interactive Container (z-index: 10) -->
        <div id="bubble-container"></div>

        <!-- 4. Board Comments Interactive Container (z-index: 12) -->
        <div id="comment-container"></div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Centralized Variables & Configs (Values/) -->
    <script src="Values/noiseConfig.js"></script>
    <script src="Values/bubbleConfig.js"></script>
    <script src="Values/connectionConfig.js"></script>
    <script src="Values/commentConfig.js"></script>
    <script src="Values/windowConfig.js"></script>
    <script src="Values/exportConfig.js"></script>
    <script src="Values/firebaseConfig.js"></script>

    <!-- Modular Scripts (Scripts/) -->
    <!-- Window System & Navigation -->
    <script src="Scripts/windowManager.js"></script>
    <script src="Scripts/savingManager.js"></script>
    <script src="Scripts/exportManager.js"></script>
    <script src="Scripts/paramsManager.js"></script>
    <script src="Scripts/displayManager.js"></script>
    <script src="Scripts/firebaseService.js"></script>
    <script src="Scripts/onlineManager.js"></script>
    <script src="Scripts/viewMenu.js"></script>

    <!-- Background & Shader -->
    <script src="Scripts/perlinShader.js"></script>
    <script src="Scripts/noiseRenderer.js"></script>

    <!-- Universe Bubbles, Connections, Comments, Physics & Interaction -->
    <script src="Scripts/bubbleManager.js"></script>
    <script src="Scripts/connectionManager.js"></script>
    <script src="Scripts/commentManager.js"></script>
    <script src="Scripts/physics.js"></script>
    <script src="Scripts/contextMenu.js"></script>
    <script src="Scripts/interaction.js"></script>

    <!-- Main Entry Point -->
    <script src="Scripts/main.js"></script>
</body>
</html>
